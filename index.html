<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARA Tool V.1</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f4;--s1:#fff;--s2:#f3f5f9;--tx:#16202e;--mut:#6a7689;--bd:#e1e6ee;
  --ac:#f5a524;--ac-d:#d98a0b;--ac-tx:#2a1a00;--amb:#fff1cf;--ink:#101a2c;--dg:#e5484d;--code:#0d1524;--codetx:#8ff0b5;--sb:rgba(16,26,44,.3);--sbh:#d98a0b;color-scheme:light;
  --sh1:0 1px 2px rgba(16,26,44,.06),0 2px 6px rgba(16,26,44,.05);
  --sh2:0 2px 4px rgba(16,26,44,.05),0 8px 20px rgba(16,26,44,.08),0 20px 40px rgba(16,26,44,.06);
  --sh3:0 4px 8px rgba(16,26,44,.08),0 16px 36px rgba(16,26,44,.14),0 40px 80px rgba(16,26,44,.14);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sb:rgba(255,255,255,.26);color-scheme:dark;--bg:#0a1120;--s1:#131d31;--s2:#1a263e;--tx:#e8edf7;--mut:#8b98b0;--bd:#24334f;--ink:#060b15;--amb:rgba(245,165,36,.2);
  --sh1:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3);
  --sh2:0 2px 4px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.4),0 24px 48px rgba(0,0,0,.3);
  --sh3:0 6px 12px rgba(0,0,0,.4),0 20px 44px rgba(0,0,0,.55),0 48px 90px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--sb:rgba(255,255,255,.26);color-scheme:dark;--bg:#0a1120;--s1:#131d31;--s2:#1a263e;--tx:#e8edf7;--mut:#8b98b0;--bd:#24334f;--ink:#060b15;--amb:rgba(245,165,36,.2);
  --sh1:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3);--sh2:0 2px 4px rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.4),0 24px 48px rgba(0,0,0,.3);--sh3:0 6px 12px rgba(0,0,0,.4),0 20px 44px rgba(0,0,0,.55),0 48px 90px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{margin:0;height:100%}[hidden]{display:none!important}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:99px;border:3px solid transparent;background-clip:content-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:var(--sbh);background-clip:content-box}
::-webkit-scrollbar-button,::-webkit-scrollbar-button:single-button,::-webkit-scrollbar-corner{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:68px 1fr;height:100%}
header{grid-column:1/-1;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:3}
.logo{width:40px;height:40px;border-radius:11px;background:var(--ac);color:var(--ac-tx);display:grid;place-items:center;font-weight:700;font-size:22px;box-shadow:0 4px 12px rgba(245,165,36,.45),inset 0 -3px 0 rgba(0,0,0,.15);flex:none}
header h1{font-size:19px;margin:0;font-weight:600}header h1 small{color:var(--ac);font-weight:500;margin-left:4px}
.sp{flex:1}.user{display:flex;align-items:center;gap:10px;font-size:13px;color:#b8c3d9}
.badge{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:#ffffff1c;color:#fff}.badge.admin{background:var(--ac);color:var(--ac-tx)}
.btn{border:0;border-radius:11px;padding:10px 18px;font-weight:500;background:var(--ac);color:var(--ac-tx);box-shadow:0 2px 0 var(--ac-d),0 6px 14px rgba(245,165,36,.35);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px);box-shadow:0 0 0 var(--ac-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:var(--s2);color:var(--tx);box-shadow:var(--sh1)}.btn.dg{background:var(--dg);color:#fff;box-shadow:0 2px 0 #b3282d,0 6px 14px rgba(229,72,77,.3)}
.btn.k{background:var(--ink);color:#fff;box-shadow:0 2px 0 #000,0 6px 14px rgba(0,0,0,.3)}
.btn.sm{padding:6px 12px;font-size:13px}.btn.h{background:#ffffff1a;color:#fff;box-shadow:none}
aside{background:var(--s1);display:flex;flex-direction:column;min-height:0;box-shadow:6px 0 24px rgba(16,26,44,.07);z-index:2}
.tools{padding:16px 14px 6px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;outline:none;box-shadow:inset 0 2px 4px rgba(16,26,44,.05)}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(245,165,36,.2)}
.cnt{padding:6px 20px;font-size:12px;color:var(--mut)}
.list{flex:1;overflow-y:auto;padding:4px 6px 16px 10px;display:flex;flex-direction:column;gap:2px}
.item{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--tx);padding:9px 10px;border-radius:12px;transition:background .15s;flex:none}
.item:hover{background:var(--s2)}
.item.on{background:var(--amb);box-shadow:var(--sh1)}.item.on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--ac)}.item .ico{width:38px;height:38px;font-size:21px;border-radius:10px;box-shadow:none}.item.on .ico{background:var(--s1);border-color:var(--ac)}
.ico{width:40px;height:40px;border-radius:11px;background:var(--s2);border:1px solid var(--bd);display:grid;place-items:center;font-size:19px;flex:none;box-shadow:var(--sh1)}
.item .tx{min-width:0}.item b{font-weight:500;display:block;line-height:1.35;font-size:14px;overflow-wrap:anywhere}
.item span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item span.nd{font-style:italic;opacity:.75}
main{overflow-y:auto;min-height:0}
.wrap{max-width:880px;margin:0 auto;padding:30px 26px 70px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.top h2{margin:0;font-size:28px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--mut);font-size:13px;margin-top:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.card{background:var(--s1);border-radius:20px;padding:26px;box-shadow:var(--sh2)}
.body p{margin:0 0 14px;line-height:1.8;max-width:72ch;white-space:pre-wrap;overflow-wrap:anywhere}
.body h3{margin:24px 0 10px;font-size:18px;padding-left:12px;border-left:4px solid var(--ac);line-height:1.4}.body h3:first-child{margin-top:0}
.body ul{margin:0 0 16px;padding-left:22px;line-height:1.8}.body li{margin:4px 0;overflow-wrap:anywhere}
.body ol{list-style:none;counter-reset:st;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:10px}
.body ol li{counter-increment:st;position:relative;margin:0;padding:12px 14px 12px 56px;background:var(--s2);border-radius:14px;line-height:1.7;box-shadow:var(--sh1)}
.body ol li:before{content:counter(st);position:absolute;left:13px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--ac-tx);display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 3px 8px rgba(245,165,36,.4)}
.body b{font-weight:600}
code{background:var(--s2);padding:2px 8px;border-radius:7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;box-shadow:var(--sh1)}
pre{background:var(--code);color:var(--codetx);padding:16px 18px;border-radius:14px;overflow-x:auto;margin:0 0 16px;position:relative;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;box-shadow:inset 0 2px 8px rgba(0,0,0,.5),var(--sh1)}
pre code{background:none;padding:0;color:inherit;box-shadow:none}
.cp{position:absolute;right:10px;top:10px;background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:4px 11px;font-size:12px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
.imgs a{position:relative;display:block}
.imgs img{width:100%;border-radius:14px;display:block;cursor:zoom-in;box-shadow:var(--sh2)}
.imgs .x{position:absolute;top:8px;right:8px}
.empty{text-align:center;color:var(--mut);padding:70px 20px}.empty .big{font-size:60px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2))}
.empty h2{color:var(--tx);margin:10px 0 6px}.empty .btn{margin:4px}
.soft{text-align:center;color:var(--mut);padding:18px 0}
label{display:block;font-size:13px;color:var(--mut);margin:16px 0 6px;text-align:left}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-height:168px;overflow:auto;padding:8px;background:var(--s2);border-radius:14px;box-shadow:inset 0 2px 6px rgba(16,26,44,.08)}
.icons button{height:44px;font-size:22px;border:2px solid transparent;border-radius:12px;background:var(--s1);box-shadow:var(--sh1)}
.icons button.on{border-color:var(--ac);background:var(--amb)}
.irow{display:flex;gap:10px;align-items:center;margin-top:10px}.irow .ico{width:44px;height:44px}
.modal{position:fixed;inset:0;background:rgba(6,10,20,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}.modal .card{width:100%;max-width:660px;max-height:92%;overflow:auto;box-shadow:var(--sh3)}
.modal h3{margin:0 0 4px;font-size:20px}.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.lb{z-index:12}.lb img{max-width:96vw;max-height:92vh;border-radius:14px;box-shadow:var(--sh3)}
.gate{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:16px;overflow:auto;background:radial-gradient(900px 500px at 15% 10%,rgba(245,165,36,.28),transparent 60%),radial-gradient(800px 500px at 90% 95%,rgba(70,110,255,.25),transparent 60%),var(--ink)}
.gate.show{display:grid}
.gcard{width:100%;max-width:400px;background:var(--s1);border-radius:24px;padding:32px 28px;box-shadow:var(--sh3);text-align:center}
.gcard .logo{margin:0 auto 14px;width:58px;height:58px;font-size:29px;border-radius:16px}
.gcard h2{margin:0;font-size:24px}.gcard p{margin:6px 0 22px;color:var(--mut);font-size:14px}
.gcard .btn{width:100%;padding:13px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:22px 0 2px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.err{color:var(--dg);font-size:13px;min-height:20px;margin:10px 0 8px}
.hint{font-size:12px;color:var(--mut);margin-top:14px;line-height:1.6}
.crumb{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--mut)}
.lnk{background:none;border:0;color:var(--ac-d);padding:4px 0;font-size:13px;font-weight:500}.lnk:hover{text-decoration:underline}
.hico{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:13px;margin-right:12px;vertical-align:middle;font-size:26px;background:var(--s2);border:1px solid var(--bd);box-shadow:var(--sh1)}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:8px;background:var(--s1);border-radius:14px;box-shadow:var(--sh1)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.pnb{text-align:left;border:0;background:var(--s1);color:var(--tx);padding:14px 16px;border-radius:14px;box-shadow:var(--sh1);transition:.15s;overflow-wrap:anywhere}
.pnb:hover{transform:translateY(-2px);box-shadow:var(--sh2)}.pnb small{display:block;color:var(--mut);margin-bottom:4px}.pnb.r{text-align:right}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fbar button{border:0;background:var(--s2);color:var(--tx);border-radius:9px;padding:6px 10px;font-size:13px;box-shadow:var(--sh1)}.fbar button:hover{background:var(--amb)}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;border:2px dashed var(--bd);border-radius:14px;padding:18px;margin:0;color:var(--tx);font-size:14px;cursor:pointer;transition:.15s}
.drop small{color:var(--mut)}.drop:hover,.drop.over{border-color:var(--ac);background:var(--amb)}
.menu{display:none}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;box-shadow:var(--sh3);max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:800px){
.app{grid-template-columns:1fr}
aside{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:5;transform:translateX(-105%);transition:.25s;width:88%;max-width:360px}
aside.open{transform:none;box-shadow:var(--sh3)}.menu{display:inline-block}
.wrap{padding:18px 14px 60px}.top h2{font-size:22px}.user .em{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="btn h sm menu" id="mbtn" aria-label="เมนูหัวข้อ">☰</button>
  <div class="logo">J</div>
  <h1>JARA Tool<small>V.1</small></h1>
  <div class="sp"></div>
  <div class="user"><button class="btn h sm" id="theme" title="สลับโหมดสว่าง/มืด" aria-label="สลับโหมดสว่าง/มืด">🌓</button><span class="em" id="em"></span><span class="badge" id="role" hidden></span><button class="btn sm" id="login" hidden>เข้าสู่ระบบ Admin</button><button class="btn h sm" id="logout" hidden>ออกจากระบบ</button></div>
</header>
<aside id="side">
  <div class="tools"><input id="q" placeholder="ค้นหาหัวข้อ  (กด / เพื่อค้นหา)" aria-label="ค้นหาหัวข้อ"></div>
  <div class="cnt" id="cnt"></div>
  <div class="list" id="list"></div>
</aside>
<main id="main"></main>
</div>

<div class="gate show" id="gate"><div class="gcard">
  <div class="logo">J</div>
  <h2>JARA Tool V.1</h2>
  <p>ศูนย์รวมวิธีแก้ปัญหา Windows และคอมพิวเตอร์</p>
  <div id="g_load" class="soft">กำลังตรวจสอบ...</div>
  <div id="g_form" hidden>
    <button class="btn" id="g_guest">เข้าชมแบบ Guest</button>
    <div class="or">หรือเข้าสู่ระบบ Admin เพื่อแก้ไขข้อมูล</div>
    <label for="g_u">ชื่อผู้ใช้</label><input id="g_u" autocomplete="username" autocapitalize="none">
    <label for="g_p">รหัสผ่าน <button type="button" class="lnk" id="pwt" style="float:right">แสดง</button></label><input id="g_p" type="password" autocomplete="current-password">
    <div class="err" id="g_err" role="alert"></div>
    <button class="btn k" id="g_in">เข้าสู่ระบบ Admin</button>
    <div class="hint" id="g_demo" hidden>โหมดทดลอง (ยังไม่ได้ใส่ค่า Firebase): ใช้ชื่อผู้ใช้ <b>admin</b> รหัสผ่าน <b>1234</b> ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น</div>
  </div>
</div></div>

<div class="modal" id="mod"><div class="card">
  <h3 id="mt">เพิ่มหัวข้อใหม่</h3>
  <label for="f_title">ชื่อหัวข้อ</label><input id="f_title" placeholder="เช่น แก้ไวรัส x64dbg.exe">
  <label>ไอคอน (เลือกจากรายการ)</label>
  <div class="icons" id="f_icons"></div>
  <div class="irow"><div class="ico" id="f_prev">📁</div><input id="f_ico" placeholder="หรือพิมพ์/วางอีโมจิเองที่นี่" aria-label="อีโมจิที่กำหนดเอง"></div>
  <label for="f_body">วิธีแก้</label>
  <div class="fbar"><button type="button" data-fmt="h"><b>H</b> หัวข้อ</button><button type="button" data-fmt="ol">1. ขั้นตอน</button><button type="button" data-fmt="ul">• รายการ</button><button type="button" data-fmt="code">&lt;/&gt; โค้ดหลายบรรทัด</button><button type="button" data-fmt="ic">`โค้ดสั้น`</button><button type="button" data-fmt="b"><b>B</b> ตัวหนา</button></div>
  <textarea id="f_body" rows="10" placeholder="# เตรียมตัว&#10;1. เปิด CMD แบบ Admin&#10;2. พิมพ์ `sfc /scannow` แล้วกด Enter"></textarea>
  <label>รูปภาพ</label>
  <label class="drop" for="f_file" id="drop"><b>ลากรูปมาวาง · คลิกเพื่อเลือก · หรือกด Ctrl+V วางภาพหน้าจอ</b><small>ย่อขนาดให้อัตโนมัติ</small></label>
  <input type="file" id="f_file" accept="image/*" multiple hidden>
  <div class="imgs" id="f_imgs"></div>
  <div class="acts"><button class="btn g" id="cancel">ยกเลิก</button><button class="btn" id="save">บันทึก</button></div>
</div></div>

<div class="modal" id="cfm"><div class="card" style="max-width:420px">
  <h3>ยืนยัน</h3><p id="cfm_t" style="line-height:1.7;overflow-wrap:anywhere"></p>
  <div class="acts"><button class="btn g" id="cfm_no">ยกเลิก</button><button class="btn dg" id="cfm_ok">ลบ</button></div>
</div></div>
<div class="modal lb" id="lb"></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
/* ============ ตั้งค่า (แก้ตรงนี้) ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDvG_CIPf5_wQ1MuF5WN0yfbg0j86H_k-w",
  authDomain: "jara-tool.firebaseapp.com",
  projectId: "jara-tool",
  appId: "1:1096075409077:web:1bd70baf5a49030620f0fc"
};
const ADMIN_EMAILS = ["admin@jara-tool.app"];   // อีเมลของ admin ต้องตรงกับที่สร้างใน Firebase Authentication และใน Rules
const EMAIL_SUFFIX = "@jara-tool.app";          // พิมพ์แค่ชื่อผู้ใช้ เช่น admin ระบบจะต่อท้ายให้
const DEMO = { user: "admin", pass: "1234" };  // ใช้เฉพาะโหมดทดลอง (ตอนยังไม่ใส่ Firebase)
/* ============================================ */
const LIVE = !!FIREBASE_CONFIG.apiKey;
const $ = s => document.getElementById(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
function fmtText(t) {

  const fp = () => { if (para.length) { h += '<p>' + inline(para.join('\n')) + '</p>'; para = []; } };

    if ((m = l.match(/^#{1,3}\s+(.*)/))) { fp(); fl(); h += '<h3>' + inline(m[1]) + '</h3>'; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { fp(); if (!list || list.t !== 'ol') { fl(); list = {t: 'ol', i: []}; } list.i.push(m[1]); continue; }

    fl(); para.push(l);

  fp(); fl(); return h;
}

      const u = c.toDataURL('image/jpeg', q); if (u.length < 300000 || m === 700) return ok(u);

  const ic = t.closest('[data-i]'); if (ic) { curIco = ic.dataset.i; $('f_ico').value = ''; return drawIcons(); }
  const rm = t.closest('[data-rm]'); if (rm) { draft.splice(+rm.dataset.rm, 1); return drawDraft(); }
  const fm = t.closest('[data-fmt]'); if (fm) return fmtInsert(fm.dataset.fmt);
  if (b && b.classList.contains('cp')) { try { await copyText(b.nextSibling.textContent); b.textContent = 'คัดลอกแล้ว'; } catch (x) { toast('คัดลอกไม่ได้'); } return; }
  switch (id) {
    case 'mbtn': return $('side').classList.toggle('open');
    case 'add': return openForm();
    case 'ed': return openForm(posts.find(x => x.id === cur));
    case 'del': {
      const p = posts.find(x => x.id === cur); if (!p) return;
      if (await ask('ลบหัวข้อ "' + p.title + '" ถาวร? ลบแล้วกู้คืนไม่ได้')) {
        try { await API.remove(p.id); delete imgCache[p.id]; posts = posts.filter(x => x.id !== p.id); cur = null; setHash(null); toast('ลบแล้ว'); rList(); rMain(); }
        catch (x) { toast('ลบไม่สำเร็จ: ' + (x.code || x.message)); }
      } return;
    }
    case 'seed':
      try { await API.seed(SEED.map((s, i) => ({title: s[1], ico: s[0], body: '', order: i, upd: Date.now(), ni: 0}))); toast('นำเข้า ' + SEED.length + ' หัวข้อแล้ว'); }
      catch (x) { toast('นำเข้าไม่สำเร็จ: ' + (x.code || x.message)); } return;
    case 'theme': { const r = document.documentElement, dk = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dk ? 'light' : 'dark'; try { localStorage.setItem('jara_theme', r.dataset.theme); } catch (x) {} return; }
    case 'pwt': { const p = $('g_p'); p.type = p.type === 'password' ? 'text' : 'password'; b.textContent = p.type === 'password' ? 'แสดง' : 'ซ่อน'; return; }
    case 'home': cur = null; setHash(null); rList(); rMain(); if (matchMedia('(max-width:800px)').matches) $('side').classList.add('open'); return;
    case 'copylink': try { await copyText(location.href.split('#')[0] + '#' + cur); toast('คัดลอกลิงก์แล้ว'); } catch (x) { toast('คัดลอกไม่ได้'); } return;
    case 'up': case 'dn': {
      const i = posts.findIndex(x => x.id === cur), j = id === 'up' ? i - 1 : i + 1; if (i < 0 || !posts[j]) return;
      const a = posts[i], c = posts[j]; let oa = a.order ?? i, oc = c.order ?? j;
      if (oa === oc) { oa = j; oc = i; } else [oa, oc] = [oc, oa];
      try { await API.setOrders([[a.id, oa], [c.id, oc]]); } catch (x) { toast('ย้ายไม่สำเร็จ: ' + (x.code || x.message)); } return;
    }
    case 'cancel': return $('mod').classList.remove('show');
    case 'save': return save();
    case 'cfm_ok': return closeCfm(true);
    case 'cfm_no': case 'cfm': return closeCfm(false);
    case 'login': $('gate').classList.add('show'); return;
    case 'logout': guest = false; sessionStorage.removeItem('jara_guest'); await API.logout(); return;
    case 'g_guest': guest = true; sessionStorage.setItem('jara_guest', '1'); return applyAuth();
    case 'g_in': return doLogin();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'g_u' || e.target.id === 'g_p')) return doLogin();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && $('mod').classList.contains('show')) return save();
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !$('gate').classList.contains('show') && !$('mod').classList.contains('show')) { e.preventDefault(); $('side').classList.add('open'); $('q').focus(); return; }
  if (e.key !== 'Escape') return;
  if ($('lb').classList.contains('show')) $('lb').classList.remove('show');
  else if ($('cfm').classList.contains('show')) closeCfm(false);
  else if ($('mod').classList.contains('show')) $('mod').classList.remove('show');
  else if (admin || guest) $('gate').classList.remove('show');
});
$('q').addEventListener('input', rList);
$('f_ico').addEventListener('input', () => { const v = firstIcon($('f_ico').value); if (v) { curIco = v; drawIcons(); } });
$('f_file').addEventListener('change', async e => { await addFiles(e.target.files); e.target.value = ''; });
const dz = $('drop');
['dragenter', 'dragover'].forEach(n => dz.addEventListener(n, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => dz.addEventListener(n, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => addFiles(e.dataTransfer.files));
document.addEventListener('paste', e => { if (!$('mod').classList.contains('show')) return; const fl = [...(e.clipboardData?.files || [])]; if (fl.length) { e.preventDefault(); addFiles(fl); } });

/* ---------- start ---------- */
if (!LIVE) $('g_demo').hidden = false;
try { const th = localStorage.getItem('jara_theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
addEventListener('hashchange', () => { const h = decodeURIComponent(location.hash.slice(1)); if (posts.find(x => x.id === h)) openPost(h); });
API.onAuth(u => { user = u; if (u) { guest = false; sessionStorage.removeItem('jara_guest'); } applyAuth(); });
API.watch(p => {
  posts = p.sort(byOrder); loaded = true; loadErr = '';
  posts.forEach(x => { const c = imgCache[x.id]; if (c && c.upd !== x.upd) delete imgCache[x.id]; });
  if (cur && !posts.find(x => x.id === cur)) cur = null;
  if (!cur && !hashDone && posts.length) { hashDone = true; const h = decodeURIComponent(location.hash.slice(1)); if (posts.find(x => x.id === h)) cur = h; }
  rList(); rMain();
}, e => { loaded = true; loadErr = e.code || e.message; rList(); rMain(); });
rList(); rMain();
</script>
</body>
